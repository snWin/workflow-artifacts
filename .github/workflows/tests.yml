name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage #this command generates a coverage report in the coverage/direcotry
      - uses: actions/upload-artifact@v7  #this step uploads that entire directory as an artifact named "test-coverage-report"
        with:
          name: test-coverage-report
          path: coverage/